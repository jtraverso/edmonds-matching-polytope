# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Edmonds' perfect matching polytope and matching polytope"
  description: >-
    A Lean 4 / Mathlib formalization of Edmonds' theorems (1965) for finite simple graphs: the
    convex hull of the incidence vectors of the perfect matchings is
    {x ≥ 0, x(δ(v)) = 1 for every vertex v, x(δ(S)) ≥ 1 for every odd set S}, and the convex hull
    of the incidence vectors of all matchings is
    {x ≥ 0, x(δ(v)) ≤ 1, x(E[S]) ≤ (|S| − 1)/2 for every odd S}. Vectors are indexed by the edges
    of the graph, the convex hull is Mathlib's convexHull, and matchings are Mathlib's
    Subgraph.IsMatching and Subgraph.IsPerfectMatching. The perfect matching theorem is proved
    for multigraphs by induction with shrinking of tight odd cuts; the matching polytope follows
    by the doubling construction. Mathlib does not contain these results.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO", "math.OC"]
  msc2020: ["05C70", "90C27", "52B12"]

sources:
  - title: "Maximum matching and a polyhedron with 0,1-vertices"
    authors:
      - "J. Edmonds"
    id: "doi:10.6028/jres.069B.013"
    type: "paper"
    location: "Journal of Research of the National Bureau of Standards, Section B 69B (1965), 125–130"
    relationship: "formalizes"
    note: >-
      The perfect matching polytope and the matching polytope theorems. The formal proof follows
      the later induction with tight odd cuts (Schrijver), not Edmonds' algorithmic proof.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Short proofs on the matching polyhedron"
    authors:
      - "A. Schrijver"
    id: "doi:10.1016/0095-8956(83)90011-4"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series B 34 (1983), 104–108"
    relationship: "background"
    note: "The short inductive proof that the formalization follows in outline."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: "Both theorems are proved for every finite simple graph."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Produced the proofs (Aristotle project e44f6366) on the pinned toolchain from the formal
        definitions and statements and a suggested proof route; the matching polytope was a
        stretch goal.
      cost:
        wall_time: "about 2 hours"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal definitions, statements and a natural-language proof route."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Design of the definitions and statements (with sanity checks of degenerate cases), audit
        of the return (statements, headers, no sorry or native_decide) and the Palomar packaging,
        checked with `lake build`, `#print axioms` and a comparison of the elaborated Challenge
        and Solution declarations (Lean v4.35.0-rc3, Mathlib
        c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "a few hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean proofs are AI-generated and
    mechanically verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound,
    identical elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    Vectors are functions on the edge set of a finite simple graph; δ(S) and E[S] are finite sets
    of edges, and the degree constraints use δ({v}). Matchings are Mathlib subgraphs, and their
    incidence vectors are 0/1 functions on the edges (decidability provided classically). The
    convex hull is taken in the real vector space of edge functions.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with the paper, checked degenerate cases (no vertices; an odd number
    of vertices), and confirmed by a local `lake build`, `#print axioms` and a comparison of the
    fully elaborated Challenge and Solution declarations that the proofs use no `sorry` and only
    propext, Classical.choice and Quot.sound. The author directed the work. No independent human
    mathematical review has been performed. The theorems are those of the cited paper; no
    mathematical novelty is claimed.

alignment:
  namespace: "EdmondsPolytope"
  statements:
    - source: "Edmonds (1965), perfect matching polytope theorem"
      lean: "EdmondsPolytope.edmonds_perfect_matching_polytope"
      module: "Challenge"
      status: "proved"
    - source: "Edmonds (1965), matching polytope theorem"
      lean: "EdmondsPolytope.edmonds_matching_polytope"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community; Harmonic's Aristotle.
